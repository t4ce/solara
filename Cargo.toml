[package]
name = "solara"
version = "0.0.6"
edition = "2024"
authors = ["iamwjun","t4ce"]
description = "TRUEOS HTML/CSS layout with a native UI4 text and line view."
default-run = "solara"
readme = "README.md"
license = "MIT"
repository = "https://github.com/iamwjun/solara"
homepage = "https://github.com/iamwjun/solara"
keywords = ["browser", "quickjs", "rust", "web", "renderer"]
categories = ["gui", "web-programming"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "LICENSE",
    "README.md",
    "preview.html",
    "src/**/*.rs",
    "src/**/*.js",
    "assets/fonts/*",
    "assets/images/*",
    "tests/**/*.rs",
    "docs/spec-layout.md",
    "docs/home.html",
    "docs/FrameworkLayout.html",
    "docs/demoui.html",
    "docs/demoui.css",
    "docs/TextAndBorders.html",
    "docs/TextAndBorders.css",
    "docs/TrueOsHome.html",
    "docs/DivsAndPanels.html",
    "docs/FlowAndForms.html",
    "docs/flow-and-forms.js",
    "docs/video_demo.html",
    "docs/engine-handoff.md",
    "docs/headless-picasso-map.md",
    "docs/javascript-css-lifecycle.md",
    "docs/youtube-js-probe.md",
]

[dependencies]
rust-qjs-dom = { version = "0.1.0", path = "vendor/RustQJSDom" }
url = "2.5.8"
# Keep Blitz's DOM/Stylo/Taffy integration on one audited revision. No shell,
# renderer, system-font discovery or HTTP client is selected by these crates.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "a50cb8971a03fb4cac697b763f8f5d01ee83cefb", default-features = false, features = ["floats"], optional = true }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "a50cb8971a03fb4cac697b763f8f5d01ee83cefb", default-features = false, optional = true }
parley = { version = "=0.11.1", default-features = false, features = ["std"], optional = true }
linebender_resource_handle = { version = "0.1", optional = true }
# Already present through Parley; expose its outline reader to the native painter.
skrifa = { version = "=0.44.0", optional = true }

[features]
default = ["spec-layout"]
spec-layout = ["dep:blitz-dom", "dep:blitz-traits", "dep:parley", "dep:linebender_resource_handle", "dep:skrifa"]
# TRUEOS selects its own host services. The default spec-layout feature adds
# measured layout to the handoff; --no-default-features retains the parse probe.
# On TRUEOS, spec-layout also selects the native text/line UI4 view.
# The host probe stays headless; neither path adds general page-script scheduling.
trueos-first = []
# Explicit visual corpus; normal launches open the homepage and navigator.
native-demos = ["spec-layout"]

[[bin]]
name = "solara"
path = "src/main.rs"

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api" }
crossterm = { path = "../../vendor/crossterm-0.29.0-trueos", default-features = false, features = ["events", "bracketed-paste"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]
resolver = "3"

# Keep the full Stylo family on one source identity across Blitz and Solara.
# TRUEOS adaptation is maintained in the fork, on the 0.20.0 release base.
[patch.crates-io]
mio = { path = "../../vendor/mio-1.2.0" }
rustix = { path = "../../vendor/rustix-1.1.4-trueos" }
signal-hook-mio = { path = "../../vendor/signal-hook-mio-0.2.5-trueos" }
stylo = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
stylo_atoms = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
stylo_dom = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
stylo_malloc_size_of = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
stylo_static_prefs = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
stylo_traits = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
stylo_derive = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
selectors = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
servo_arc = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
to_shmem = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
to_shmem_derive = { git = "https://github.com/t4ce/stylo", rev = "3786da941f0042c923fb5981a0edda86b8d38dba" }
