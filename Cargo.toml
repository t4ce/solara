[package]
name = "solara"
version = "0.0.6"
edition = "2024"
authors = ["iamwjun","t4ce"]
description = "TRUEOS-first Solara placeholder; browser/rendering work is currently inactive."
default-run = "solara"
readme = "README.md"
license = "MIT"
repository = "https://github.com/iamwjun/solara"
homepage = "https://github.com/iamwjun/solara"
keywords = ["browser", "quickjs", "rust", "web", "renderer"]
categories = ["gui", "web-programming"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "LICENSE",
    "README.md",
    "preview.html",
    "src/**/*.rs",
    "src/**/*.js",
    "docs/demoui.html",
    "docs/demoui.css",
    "docs/TextAndBorders.html",
    "docs/TextAndBorders.css",
    "docs/video_demo.html",
    "docs/engine-handoff.md",
    "docs/headless-picasso-map.md",
    "docs/youtube-js-probe.md",
]

[features]
default = []
# The browser, DOM, WGPU, and UI4 scene paths are intentionally inactive on
# this branch. These names remain only as an explicit record that no renderer
# feature is selected while the TRUEOS-first entry is being rebuilt.
trueos-first = []
[[bin]]
name = "solara"
path = "src/main.rs"

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]
resolver = "3"
