[package]
name = "solara"
version = "0.0.6"
edition = "2024"
authors = ["iamwjun","t4ce"]
description = "TRUEOS-first HTML/CSS parsing and retained standards-based layout."
default-run = "solara"
readme = "README.md"
license = "MIT"
repository = "https://github.com/iamwjun/solara"
homepage = "https://github.com/iamwjun/solara"
keywords = ["browser", "quickjs", "rust", "web", "renderer"]
categories = ["gui", "web-programming"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "LICENSE",
    "README.md",
    "preview.html",
    "src/**/*.rs",
    "src/**/*.js",
    "assets/fonts/*",
    "tests/**/*.rs",
    "docs/spec-layout.md",
    "docs/FrameworkLayout.html",
    "docs/demoui.html",
    "docs/demoui.css",
    "docs/TextAndBorders.html",
    "docs/TextAndBorders.css",
    "docs/TrueOsHome.html",
    "docs/DivsAndPanels.html",
    "docs/FlowAndForms.html",
    "docs/flow-and-forms.js",
    "docs/video_demo.html",
    "docs/engine-handoff.md",
    "docs/headless-picasso-map.md",
    "docs/javascript-css-lifecycle.md",
    "docs/youtube-js-probe.md",
]

[dependencies]
rust-qjs-dom = { version = "0.1.0", path = "vendor/RustQJSDom" }
url = "2.5.8"
# Keep Blitz's DOM/Stylo/Taffy integration on one audited revision. No shell,
# renderer, system-font discovery or HTTP client is selected by these crates.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "a50cb8971a03fb4cac697b763f8f5d01ee83cefb", default-features = false, features = ["floats"], optional = true }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "a50cb8971a03fb4cac697b763f8f5d01ee83cefb", default-features = false, optional = true }
parley = { version = "=0.11.1", default-features = false, features = ["std"], optional = true }
linebender_resource_handle = { version = "0.1", optional = true }

[features]
default = ["spec-layout"]
spec-layout = ["dep:blitz-dom", "dep:blitz-traits", "dep:parley", "dep:linebender_resource_handle"]
# TRUEOS selects its own host services. The default spec-layout feature adds
# measured layout to the handoff; --no-default-features retains the parse probe.
# Neither path selects a renderer or general page-script scheduling.
trueos-first = []

[[bin]]
name = "solara"
path = "src/main.rs"

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]
resolver = "3"
