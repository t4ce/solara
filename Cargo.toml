[package]
name = "solara"
version = "0.0.6"
edition = "2024"
authors = ["iamwjun","t4ce"]
description = "TRUEOS-first, renderer-free HTML, CSS, and first-script handoff probe."
default-run = "solara"
readme = "README.md"
license = "MIT"
repository = "https://github.com/iamwjun/solara"
homepage = "https://github.com/iamwjun/solara"
keywords = ["browser", "quickjs", "rust", "web", "renderer"]
categories = ["gui", "web-programming"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "LICENSE",
    "README.md",
    "preview.html",
    "src/**/*.rs",
    "src/**/*.js",
    "docs/demoui.html",
    "docs/demoui.css",
    "docs/TextAndBorders.html",
    "docs/TextAndBorders.css",
    "docs/TrueOsHome.html",
    "docs/DivsAndPanels.html",
    "docs/FlowAndForms.html",
    "docs/flow-and-forms.js",
    "docs/video_demo.html",
    "docs/engine-handoff.md",
    "docs/headless-picasso-map.md",
    "docs/javascript-css-lifecycle.md",
    "docs/youtube-js-probe.md",
]

[dependencies]
rust-qjs-dom = { version = "0.1.0", path = "vendor/RustQJSDom" }

[features]
default = []
# This stage embeds and parses the fixed five-page corpus. It intentionally
# selects no WGPU, UI4 frame, Picasso, networking, or general page-script
# scheduling. The host executes at most the first supported classic script.
trueos-first = []

[[bin]]
name = "solara"
path = "src/main.rs"

[target.'cfg(any(target_os = "trueos", target_os = "zkvm"))'.dependencies]
trueos = { path = "../../api" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[workspace]
resolver = "3"
